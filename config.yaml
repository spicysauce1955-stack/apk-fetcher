# APK Scraper Configuration
# Define apps and versions to fetch

output_dir: ./downloads
headless: true

apps:
  telegram:
    versions:
      - "12.4.0"
    sources:
      apkmirror:
        developer: telegram-fz-llc
        app_name: telegram
        variant_index: 0  # 0 = first variant (usually universal)
      uptodown:
        app_slug: telegram
      apkpure:
        package: org.telegram.messenger
        app_slug: telegram

